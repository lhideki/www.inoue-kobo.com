name: Sync articles to Zenn

# Zenn has no article-posting API. Its GitHub integration instead watches
# this repository's articles/ directory directly, so "posting" means
# regenerating that directory from www/content and pushing the diff; Zenn
# picks up the change on its own once the repo is connected via
# https://zenn.dev/dashboard/deploys.
on:
    push:
        branches:
            - master
        paths:
            - 'www/content/**' # 新規カテゴリを追加してもここは変更不要
            - '!www/content/about.md'
            - '!www/content/schedule.md'
            - '!www/content/trainings.md'
            - '!www/content/training/**'
            - '!www/content/webservice/**'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    sync:
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Install dependencies
              run: pip install -r scripts/requirements.txt

            - name: Generate Zenn articles
              run: python scripts/zenn_sync.py

            - name: Commit and push if changed
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  git add articles
                  if git diff --cached --quiet; then
                    echo 'No changes to commit.'
                  else
                    git commit -m 'Sync articles for Zenn'
                    git push
                  fi
